<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================= PROJECT CONFIG - edit for each building =================
const CFG = {
  code: '17B',                                  // used in file names: <code>_<view>.png, <code>_walkthrough.mp4
  title: '17B Waste Handling Area',             // viewer start card
  project: 'Project A',             // viewer start card subtitle
  gridPrefix: '17-',                            // grid label prefix for the HUD (17-01 ... 17-14)
};
document.title = CFG.code + ' Render';
// ==========================================================================
// ---------------- Building 17B data (model coords, metres: x along grid 17-01->17-14, y from 17-A to 17-B, z up) ----------------
const Q = new URLSearchParams(location.search);
const K4 = Q.get('res') === '4k';
const W = K4 ? 3840 : 1920, H = K4 ? 2160 : 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const V = (x, y, z) => new THREE.Vector3(x, z, -y);
const roofTop = y => 5.96 - (11.55 - y) * 0.05;
const roofUnder = y => roofTop(y) - 0.10;

// ---------------- procedural textures ----------------
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const noise = (g, w, h, a) => { for (let i = 0; i < w * h / 6; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? 0 : 255},${Math.random() < .5 ? 0 : 255},${Math.random() < .5 ? 0 : 255},${a})`; g.fillRect(Math.random() * w, Math.random() * h, 1, 1); } };
// porcelain 600x600 tile (1 tile per 0.6m) -> texture covers 1.2m (2x2 tiles)
const tileTex = (base, grout) => canvasTex(256, 256, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h); noise(g, w, h, .05); g.strokeStyle = grout; g.lineWidth = 3; for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 2); g.lineTo(w, i * h / 2); g.stroke(); } });
const corrTex = (base, dark, vertical) => canvasTex(256, 256, (g, w, h) => { const grd = vertical ? g.createLinearGradient(0, 0, w / 8, 0) : g.createLinearGradient(0, 0, 0, h / 8); grd.addColorStop(0, base); grd.addColorStop(.5, dark); grd.addColorStop(1, base); g.fillStyle = grd; for (let i = 0; i < 8; i++) { vertical ? g.fillRect(i * w / 8, 0, w / 8, h) : g.fillRect(0, i * h / 8, w, h / 8); } });
const meshTex = canvasTex(256, 256, (g, w, h) => { g.clearRect(0, 0, w, h); g.strokeStyle = '#d9dde0'; g.lineWidth = 4; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * w / 8, 0); g.lineTo(i * w / 8, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 8); g.lineTo(w, i * h / 8); g.stroke(); } });
const asphaltTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#4a4c4f'; g.fillRect(0, 0, w, h); noise(g, w, h, .12); });
const concTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#b9b6ae'; g.fillRect(0, 0, w, h); noise(g, w, h, .07); g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h); });
const blockTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#e9e8e2'; g.fillRect(0, 0, w, h); noise(g, w, h, .04); g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 2; for (let r = 0; r < 4; r++) { g.beginPath(); g.moveTo(0, r * h / 4); g.lineTo(w, r * h / 4); g.stroke(); for (let c = 0; c < 2; c++) { const x = (c + (r % 2) * .5) * w / 2; g.beginPath(); g.moveTo(x, r * h / 4); g.lineTo(x, (r + 1) * h / 4); g.stroke(); } } });
const gratingTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#2a2d31'; g.fillRect(0, 0, w, h); g.fillStyle = '#8d949b'; for (let i = 0; i < 16; i++) g.fillRect(i * w / 16, 0, 3, h); g.fillRect(0, 0, w, 3); });

const M = (o) => new THREE.MeshStandardMaterial(o);
const mat = {
  tileF3: M({ map: tileTex('#c9cbcc', '#9fa3a6'), roughness: .35, metalness: 0 }),
  tileF2: M({ map: tileTex('#a6533b', '#6b3426'), roughness: .8 }),
  slabEdge: M({ map: concTex, roughness: .9 }),
  asphalt: M({ map: asphaltTex, roughness: .95 }),
  apron: M({ map: concTex, roughness: .9 }),
  grating: M({ map: gratingTex, roughness: .5, metalness: .6 }),
  navy: M({ color: 0x1d3f7a, roughness: .7 }),
  paint: M({ map: blockTex, roughness: .85 }),
  clad: M({ map: corrTex('#e6ebef', '#b9c2ca', true), roughness: .45, metalness: .35 }),
  roof: M({ map: corrTex('#dfe5ea', '#aab4bd', false), roughness: .4, metalness: .4, side: THREE.DoubleSide }),
  steel: M({ color: 0x2b55a6, roughness: .45, metalness: .5 }),
  upstand: M({ map: concTex, roughness: .9 }),
  mesh: M({ map: meshTex, alphaTest: .4, transparent: false, side: THREE.DoubleSide, roughness: .4, metalness: .7 }),
  shutter: M({ map: corrTex('#d4d8dc', '#9aa1a8', false), roughness: .35, metalness: .6 }),
  door: M({ color: 0x8e979f, roughness: .45, metalness: .5 }),
  louvre: M({ map: corrTex('#50575e', '#22262a', false), roughness: .5, metalness: .6 }),
  lampBody: M({ color: 0xdfe3e6, roughness: .4, metalness: .3 }),
  lampLit: M({ color: 0xffffff, emissive: 0xfff6e8, emissiveIntensity: 4 }),
  rod: M({ color: 0x9aa0a6, metalness: .7, roughness: .4 }),
  isw: M({ color: 0x9a9d9f, roughness: .5 }),
  db: M({ color: 0xd9d6c8, roughness: .5, metalness: .2 }),
  eyewash: M({ color: 0x2f9e44, roughness: .4 }),
  yellow: M({ color: 0xf2c200, roughness: .5, metalness: .3 }),
  grass: M({ color: 0x5e7d3c, roughness: 1 }),
};
const uvScale = (geo, s) => { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * s[0], uv.getY(i) * s[1]); return geo; };

const groups = { roof: new THREE.Group(), lights: new THREE.Group(), labels: new THREE.Group(), building: new THREE.Group(), site: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));

function box(x1, y1, z1, x2, y2, z2, m, grp = groups.building, opts = {}) {
  const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1), dz = Math.abs(z2 - z1);
  const geo = new THREE.BoxGeometry(dx, dz, dy);
  if (opts.uv) { // world-scaled UVs per face
    const pos = geo.attributes.pos, uv = geo.attributes.uv, n = geo.attributes.normal;
    for (let i = 0; i < uv.count; i++) {
      const p = new THREE.Vector3().fromBufferAttribute(geo.attributes.position, i), nn = new THREE.Vector3().fromBufferAttribute(n, i);
      let u, v; if (Math.abs(nn.y) > .5) { u = p.x; v = p.z; } else if (Math.abs(nn.x) > .5) { u = p.z; v = p.y; } else { u = p.x; v = p.y; }
      uv.setXY(i, (u + (x1 + x2) / 2 * (Math.abs(nn.x) > .5 ? 0 : 1)) / opts.uv, (v + (Math.abs(nn.y) > .5 ? -(y1 + y2) / 2 : (z1 + z2) / 2)) / opts.uv);
    }
  }
  const me = new THREE.Mesh(geo, m); me.position.copy(V((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2));
  me.castShadow = opts.cast !== false; me.receiveShadow = true; grp.add(me); return me;
}
// prism from a (u,z) polygon. axis 'x': u = model x, extruded over y in [a,b]; axis 'y': u = model y, extruded over x in [a,b]
function prism(pts, axis, a, b, m, grp = groups.building, tex = 1) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const geo = new THREE.ExtrudeGeometry(s, { depth: b - a, bevelEnabled: false });
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / tex, uv.getY(i) / tex);
  const me = new THREE.Mesh(geo, m);
  if (axis === 'x') { me.position.set(0, 0, -b); }
  else { me.rotation.y = Math.PI / 2; me.position.set(a, 0, 0); }
  me.castShadow = true; me.receiveShadow = true; grp.add(me); return me;
}
// wall band with rectangular openings, sloped/const top. openings: [u1,u2,z1,z2]
function wallBand(axis, a, b, u0, u1, z0, top, ops, m, tex = 2) {
  const topF = typeof top === 'function' ? top : () => top;
  const us = [u0, u1], zs = [z0];
  ops.forEach(o => { [o[0], o[1]].forEach(u => { if (u > u0 && u < u1) us.push(u); }); [o[2], o[3]].forEach(z => { if (z > z0 && z < Math.min(topF(u0), topF(u1))) zs.push(z); }); });
  const U = [...new Set(us)].sort((p, q) => p - q), Z = [...new Set(zs)].sort((p, q) => p - q);
  for (let i = 0; i < U.length - 1; i++) for (let j = 0; j < Z.length; j++) {
    const ua = U[i], ub = U[i + 1], za = Z[j], last = j === Z.length - 1;
    const zb = last ? null : Z[j + 1];
    const um = (ua + ub) / 2, zm = last ? (za + topF(um)) / 2 : (za + zb) / 2;
    if (ops.some(o => um > o[0] && um < o[1] && zm > o[2] && zm < o[3])) continue;
    const pts = last ? [[ua, za], [ub, za], [ub, topF(ub)], [ua, topF(ua)]] : [[ua, za], [ub, za], [ub, zb], [ua, zb]];
    if (last && topF(um) <= za + .001) continue;
    prism(pts, axis, a, b, m, groups.building, tex);
  }
}

// ---------------- site ----------------
const grassTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#6e8f47'; g.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { g.fillStyle = `hsl(${85 + Math.random() * 25},${35 + Math.random() * 20}%,${28 + Math.random() * 18}%)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, 600, 600);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), M({ map: grassTex, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.25;
ground.receiveShadow = true; groups.site.add(ground);
{ const g = new THREE.PlaneGeometry(160, 37); asphaltTex.repeat.set(24, 6); const pad = new THREE.Mesh(g, mat.asphalt); pad.rotation.x = -Math.PI / 2; pad.position.copy(V(40, 3.5, -0.2)); pad.receiveShadow = true; groups.site.add(pad); }
// trees for context
{ let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const bark = M({ color: 0x4a3a2b, roughness: 1 });
  const leafTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { const l = 120 + Math.random() * 135 | 0; g.fillStyle = `rgb(${l},${l},${l})`; g.beginPath();
      g.ellipse(Math.random() * w, Math.random() * h, 3 + Math.random() * 5, 1.5 + Math.random() * 2.5, Math.random() * Math.PI, 0, Math.PI * 2); g.fill(); } }, 4, 3);
  leafTex.colorSpace = THREE.NoColorSpace;
  const leafMat = M({ vertexColors: true, map: leafTex, roughness: .8, metalness: 0 });
  // 3D value noise for lumpy, irregular foliage
  const hash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
  const vnoise = (x, y, z) => { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf); const L = (a, b, t) => a + (b - a) * t;
    return L(L(L(hash(xi, yi, zi), hash(xi + 1, yi, zi), u), L(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u), v),
             L(L(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u), L(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v), w); };
  const fbm = (x, y, z) => vnoise(x, y, z) * .6 + vnoise(x * 2.3, y * 2.3, z * 2.3) * .3 + vnoise(x * 5.1, y * 5.1, z * 5.1) * .1;
  // one leaf clump: noisy sphere, darker underneath, colour-varied
  function clump(r, cx, cy, cz, base, canopyBottom, canopyTop, off) {
    const g = new THREE.IcosahedronGeometry(r, 3), p = g.attributes.position, col = [], c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i), n = fbm(vx * 1.4 / r + off, vy * 1.4 / r + off, vz * 1.4 / r + off);
      const k = .72 + n * .55; p.setXYZ(i, vx * k, vy * k * .85, vz * k);
      const wy = cy + vy * k * .85, t = THREE.MathUtils.clamp((wy - canopyBottom) / (canopyTop - canopyBottom), 0, 1);
      c.copy(base).offsetHSL((n - .5) * .05, 0, (n - .5) * .12); c.multiplyScalar(.45 + .65 * t); col.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.deleteAttribute('normal');
    const gs = mergeVertices(g, 1e-4); gs.computeVertexNormals();
    const m = new THREE.Mesh(gs, leafMat); m.position.set(cx, cy, cz); m.castShadow = true; m.receiveShadow = true; groups.site.add(m);
  }
  function limb(a, b, r0, r1) {
    const d = new THREE.Vector3().subVectors(b, a), len = d.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 7), bark);
    m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.castShadow = true; groups.site.add(m);
  }
  const greens = [0x3c6a2a, 0x4a7a31, 0x557f2f, 0x35602a, 0x5d8a3a];
  function tree(x, y, s) {
    const base = new THREE.Color(greens[Math.floor(rnd() * greens.length)]);
    const g0 = V(x, y, -0.2), lean = new THREE.Vector3((rnd() - .5) * .5, 0, (rnd() - .5) * .5).multiplyScalar(s);
    const fork = g0.clone().add(new THREE.Vector3(0, (2.0 + rnd() * .8) * s, 0)).add(lean);
    limb(g0, fork, .22 * s, .14 * s);
    const crownR = (2.3 + rnd() * .8) * s, crownC = fork.clone().add(new THREE.Vector3(0, crownR * .85, 0));
    const bottom = crownC.y - crownR * .9, top = crownC.y + crownR * 1.0;
    // main lobes on branches
    const nLobes = 5 + Math.floor(rnd() * 4);
    for (let i = 0; i < nLobes; i++) {
      const a = rnd() * Math.PI * 2, el = (rnd() - .25) * 1.1, d = crownR * (.45 + rnd() * .4);
      const pc = crownC.clone().add(new THREE.Vector3(Math.cos(a) * Math.cos(el) * d, Math.sin(el) * d * .75, Math.sin(a) * Math.cos(el) * d));
      if (i < 4) limb(fork, pc.clone().lerp(fork, .35), .1 * s, .045 * s);
      clump(crownR * (.42 + rnd() * .25), pc.x, pc.y, pc.z, base, bottom, top, rnd() * 50);
    }
    clump(crownR * .62, crownC.x, crownC.y + crownR * .2, crownC.z, base, bottom, top, rnd() * 50);
    // small outer clumps to break the silhouette
    for (let i = 0; i < 10; i++) {
      const a = rnd() * Math.PI * 2, el = (rnd() - .15) * 1.3, d = crownR * (.85 + rnd() * .25);
      clump(crownR * (.16 + rnd() * .14), crownC.x + Math.cos(a) * Math.cos(el) * d, crownC.y + Math.sin(el) * d * .7, crownC.z + Math.sin(a) * Math.cos(el) * d, base, bottom, top, rnd() * 50);
    }
  }
  for (let x = -24; x <= 100; x += 10) { tree(x + rnd() * 4, -25 - rnd() * 6, .75 + rnd() * .45); tree(x + rnd() * 4, 28 + rnd() * 8, .75 + rnd() * .45); }
}
// road marking & kerbs/grass for context
box(-30, -9, -0.2, 110, -8.85, -0.19, M({ color: 0xf2f2f2, roughness: .8 }), groups.site, { cast: false });
box(-40, -16.2, -0.25, 120, -15.0, 0.0, mat.apron, groups.site);
box(-40, 22.0, -0.25, 120, 23.2, 0.0, mat.apron, groups.site);
// slab with floor finishes
box(0, 0, -0.35, 72.02, 10, -0.02, mat.slabEdge);
const zones = [[0.2, 28, 'F3'], [28, 38, 'F2'], [38, 48, 'F3'], [48, 58, 'F2'], [58, 71.8, 'F3']];
zones.forEach(([a, b, f]) => { const g = new THREE.PlaneGeometry(b - a, 9.6); uvScale(g, [(b - a) / 1.2, 9.6 / 1.2]); const me = new THREE.Mesh(g, f === 'F2' ? mat.tileF2 : mat.tileF3); me.rotation.x = -Math.PI / 2; me.position.copy(V((a + b) / 2, 5, 0)); me.receiveShadow = true; groups.building.add(me); });
// SS floor gutters + concrete ramps (10%)
[[-0.6, 0], [10, 10.6]].forEach(([a, b]) => { const g = new THREE.PlaneGeometry(72.02, b - a); uvScale(g, [72.02 * 3, 2]); const me = new THREE.Mesh(g, mat.grating); me.rotation.x = -Math.PI / 2; me.position.copy(V(36.01, (a + b) / 2, -0.1)); me.receiveShadow = true; groups.site.add(me); });
prism([[-2.0, -0.45], [-0.6, -0.45], [-0.6, -0.1], [-2.0, -0.2]].map(([y, z]) => [y, z]), 'y', -0.2, 72.22, mat.apron, groups.site, 3);
prism([[10.6, -0.45], [12.0, -0.45], [12.0, -0.2], [10.6, -0.1]], 'y', -0.2, 72.22, mat.apron, groups.site, 3);

// ---------------- structure: columns, rafters, roof ----------------
const gx = [0, 6, 12, 16, 20, 28, 33, 38, 43, 48, 53, 58, 64, 72];
gx.forEach(x => {
  const xc = Math.min(Math.max(x, 0.1), 71.9);
  [0.1, 9.9].forEach(yc => box(xc - .15, yc - .1, 0, xc + .15, yc + .1, roofUnder(yc) - .45, mat.steel));
  // rafter (sloped I-beam approximated as prism, depth 0.45, flange 0.2)
  prism([[-2.0, roofUnder(-2.0) - .45], [11.55, roofUnder(11.55) - .45], [11.55, roofUnder(11.55)], [-2.0, roofUnder(-2.0)]], 'y', xc - .1, xc + .1, mat.steel);
});
// purlins (Z-purlins, galvanised) + insulation lining under roof sheet (R1: clip-lock roof with insulation)
const purlinMat = M({ color: 0xb8bec4, roughness: .45, metalness: .6 });
for (let y = -1.8; y <= 11.4; y += 1.5) box(-0.3, y - .04, roofUnder(y) - .2, 72.3, y + .04, roofUnder(y) - .03, purlinMat, groups.roof);
prism([[-2.0, roofUnder(-2.0) - .03], [11.55, roofUnder(11.55) - .03], [11.55, roofUnder(11.55) - .005], [-2.0, roofUnder(-2.0) - .005]], 'y', -0.3, 72.3, M({ map: corrTex('#eef0f0', '#d6dadc', false), roughness: .7, side: THREE.DoubleSide }), groups.roof, 1.5);
// roof sheet with gutter-side fascia
{ const me = prism([[-2.0, roofUnder(-2.0)], [11.55, roofUnder(11.55)], [11.55, roofTop(11.55)], [-2.0, roofTop(-2.0)]], 'y', -0.3, 72.3, mat.roof, groups.roof, 1.2); me.castShadow = true; }
box(-0.3, -2.15, roofTop(-2.0) - .35, 72.3, -2.0, roofTop(-2.0) + .05, M({ color: 0xc9d0d6, metalness: .5, roughness: .4 }), groups.roof);

// ---------------- walls ----------------
const RS = (c) => [c - 2, c + 2, -1, 3.0], ED = (c) => [c - .5, c + .5, -1, 2.4];

    if (/Basic Render|SwiftShader|llvmpipe|Software/i.test(gpuName)) {
      ov.querySelector('.card').insertAdjacentHTML('afterbegin', `<div style="background:#7a1f1f;border:1px solid #e06060;border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:14px">
        <b>⚠ Trình duyệt đang vẽ 3D bằng CPU, không dùng card đồ họa</b> - sẽ bị giật.<br>
        Chrome/Edge: Cài đặt → Hệ thống → bật <b>"Sử dụng tính năng tăng tốc đồ họa khi có"</b> (Use graphics acceleration when available) → <b>Khởi chạy lại</b>.<br>
        <span style="color:#f3b0b0">Renderer hiện tại: ${gpuName}</span></div>`);
    } }
  let toastT = 0; const say = m => { toast.textContent = m; toast.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => toast.style.opacity = 0, 1400); };

  // render scale: starts at 1 (ignores high-DPI), adaptive between 0.6 and 1 to hold ~50+ fps
  let pr = 1;
  const resize = () => { const w = innerWidth, h = innerHeight; renderer.setPixelRatio(pr); renderer.setSize(w, h); composer.setPixelRatio(pr); composer.setSize(w, h); bloom.setSize(w * pr, h * pr); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  camera.fov = 70; camera.updateProjectionMatrix();
  // ---- performance: 54 fixture area lights -> 10 zone lights (same total output), none by day ----
  areaLights.forEach(l => scene.remove(l));
  const zoneDefs = [[0.2, 12], [12, 16], [16, 20], [20, 28], [28, 38], [38, 43], [43, 48], [48, 58], [58, 64], [64, 71.8]];
  const zones = zoneDefs.map(([a, b]) => {
    const n = fx.filter(([x]) => x > a && x < b).length, w = b - a - .4, h = 9.2;
    const l = new THREE.RectAreaLight(0xfff3e0, 0, w, h); l.position.copy(V((a + b) / 2, 5, 4.5)); l.rotation.x = -Math.PI / 2;
    scene.add(l); return { l, factor: n * .08 * 1.2 / (w * h) * 1.6 };
  });
  areaLights.length = 0; zones.forEach(z => areaLights.push(z.l));
  function applyMood(m) {
    setMood(m);
    const night = m !== 'day';
    zones.forEach(z => { z.l.visible = night; z.l.intensity *= z.factor; });
    bloom.enabled = night;
    renderer.shadowMap.needsUpdate = true;
  }
  let mood = 'day'; applyMood(mood); groups.roof.visible = true; setShutters(true);
  renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;

  // ---- colliders: solid building/site meshes (not foliage, lights, roof, labels) ----
  const solids = [], boxes = [];
  [groups.building, groups.site].forEach(g => g.traverse(o => { if (o.isMesh && o.material && !o.material.vertexColors && o !== ground) solids.push(o); }));
  const rebuildBoxes = () => { boxes.length = 0; solids.forEach(o => { if (shutters.includes(o) && !o.visible) return; o.updateWorldMatrix(true, false); const b = new THREE.Box3().setFromObject(o); if (b.max.y - b.min.y > .3) boxes.push(b); }); };
  rebuildBoxes();
  const groundList = [...solids, ground];   // raycast ignores .visible, so hidden originals still work

  // ---- performance: merge static meshes per material (~2000 draw calls -> ~40) ----
  // originals stay (hidden) for collision + ground raycast; shutters stay separate (toggle with O)
  function mergeStatic(group) {
    group.updateMatrixWorld(true);
    const buckets = new Map(), originals = [];
    group.traverse(o => { if (o.isMesh && !shutters.includes(o)) originals.push(o); });
    for (const o of originals) {
      let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      const keep = ['position', 'normal', 'uv'].concat(o.material.vertexColors ? ['color'] : []);
      Object.keys(g.attributes).forEach(k => { if (!keep.includes(k)) g.deleteAttribute(k); });
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
      if (!g.attributes.normal) g.computeVertexNormals();
      g.clearGroups();
      const key = o.material.uuid;
      if (!buckets.has(key)) buckets.set(key, { mat: o.material, geos: [], cast: false, recv: false });
      const bk = buckets.get(key); bk.geos.push(g); bk.cast ||= o.castShadow; bk.recv ||= o.receiveShadow;
    }
    for (const bk of buckets.values()) {
      const merged = mergeGeometries(bk.geos, false); if (!merged) continue;
      const m = new THREE.Mesh(merged, bk.mat); m.castShadow = bk.cast; m.receiveShadow = bk.recv; group.add(m);
    }
    originals.forEach(o => o.visible = false);
    return originals.length + ' -> ' + buckets.size;
  }
  const mergeReport = ['building', 'site', 'lights', 'roof'].map(k => k + ': ' + mergeStatic(groups[k])).join(', ');
  console.log('merged', mergeReport);

  const controls = new PointerLockControls(camera, document.body);
  ov.addEventListener('click', () => controls.lock());
  controls.addEventListener('lock', () => ov.style.display = 'none');
  controls.addEventListener('unlock', () => ov.style.display = 'flex');

  const EYE = 1.65, RAD = .3, STEP = .4, G = -18;
  const player = { feet: V(10, -5, 0), vy: 0, onGround: false, ghost: false };
  player.feet.y = 0; camera.position.copy(player.feet).add(new THREE.Vector3(0, EYE, 0)); camera.lookAt(V(14, 5, 1.8));
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!controls.isLocked && !window._forceWalk) return;
    if (e.code === 'KeyF') { player.ghost = !player.ghost; player.vy = 0; say(player.ghost ? 'Ghost mode: BẬT' : 'Ghost mode: TẮT'); }
    if (e.code === 'Space') { e.preventDefault(); if (!player.ghost && player.onGround) { player.vy = 5.2; player.onGround = false; } }
    if (e.code === 'KeyR') { groups.roof.visible = !groups.roof.visible; renderer.shadowMap.needsUpdate = true; say(groups.roof.visible ? 'Hiện mái' : 'Ẩn mái'); }
    if (e.code === 'KeyL') { groups.labels.visible = !groups.labels.visible; say(groups.labels.visible ? 'Hiện nhãn khu vực' : 'Ẩn nhãn'); }
    if (e.code === 'KeyO') { const open = shutters[0].visible; setShutters(open); rebuildBoxes(); renderer.shadowMap.needsUpdate = true; say(open ? 'Mở cửa cuốn' : 'Đóng cửa cuốn'); }
    const moods = { Digit1: 'day', Digit2: 'dusk', Digit3: 'night' };
    if (moods[e.code]) { mood = moods[e.code]; applyMood(mood); say({ day: 'Ban ngày', dusk: 'Hoàng hôn', night: 'Ban đêm' }[mood]); }
  });
  addEventListener('keyup', e => keys[e.code] = false);

  const ray = new THREE.Raycaster(); const DOWN = new THREE.Vector3(0, -1, 0);
  function groundAt(p) {
    ray.set(new THREE.Vector3(p.x, p.y + STEP + .05, p.z), DOWN); ray.far = STEP + 30;
    const h = ray.intersectObjects(groundList, false)[0]; return h ? h.point.y : -0.25;
  }
  function blocked(p) {
    const lo = p.y + STEP, hi = p.y + EYE + .1;
    for (const b of boxes) {
      if (b.max.y <= lo || b.min.y >= hi) continue;
      const cx = THREE.MathUtils.clamp(p.x, b.min.x, b.max.x), cz = THREE.MathUtils.clamp(p.z, b.min.z, b.max.z);
      if ((p.x - cx) ** 2 + (p.z - cz) ** 2 < RAD * RAD) return true;
    }
    return false;
  }
  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), clock = new THREE.Clock();
  function gridRef(x) { let best = 0; gx.forEach((g, i) => { if (Math.abs(g - x) < Math.abs(gx[best] - x)) best = i; }); return CFG.gridPrefix + String(best + 1).padStart(2, '0'); }
  let fpsAcc = 0, fpsN = 0, fpsShow = 0, adaptCool = 2;
  function update(dt) {
    {
      const run = keys.ShiftLeft || keys.ShiftRight;
      const speed = player.ghost ? (run ? 14 : 5) : (run ? 5.5 : 2.0);
      camera.getWorldDirection(fwd); if (!player.ghost) fwd.y = 0; fwd.normalize(); right.crossVectors(fwd, camera.up).normalize();
      const mv = new THREE.Vector3();
      if (keys.KeyW) mv.add(fwd); if (keys.KeyS) mv.sub(fwd); if (keys.KeyD) mv.add(right); if (keys.KeyA) mv.sub(right);
      if (mv.lengthSq()) mv.normalize().multiplyScalar(speed * dt);
      if (player.ghost) {
        if (keys.Space || keys.KeyE) mv.y += speed * dt; if (keys.KeyQ) mv.y -= speed * dt;
        player.feet.add(mv);
      } else {
        const nx = player.feet.clone(); nx.x += mv.x; if (!blocked(nx)) player.feet.x = nx.x;
        const nz = player.feet.clone(); nz.z += mv.z; if (!blocked(nz)) player.feet.z = nz.z;
        const gy = groundAt(player.feet);
        player.vy += G * dt; player.feet.y += player.vy * dt;
        if (player.feet.y <= gy) { player.feet.y = gy; player.vy = 0; player.onGround = true; } else player.onGround = player.feet.y - gy < .02;
      }
      camera.position.set(player.feet.x, player.feet.y + EYE, player.feet.z);
    }
  }
  function tick() {
    const dt = Math.min(clock.getDelta(), .05);
    fpsAcc += dt; fpsN++;
    if (fpsAcc > .5) {
      fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0;
      // adaptive render scale (only while the user is actually walking)
      if (controls.isLocked && (adaptCool -= .5) <= 0) {
        if (fpsShow < 45 && pr > .6) { pr = Math.max(.6, +(pr - .1).toFixed(2)); resize(); adaptCool = 1.5; }
        else if (fpsShow > 58 && pr < 1) { pr = Math.min(1, +(pr + .1).toFixed(2)); resize(); adaptCool = 3; }
      }
    }
    if (controls.isLocked) update(dt);
    const mx = camera.position.x, my = -camera.position.z;
    hud.innerHTML = `<b>${player.ghost ? 'GHOST' : 'WALK'}</b> · ${{ day: 'Ban ngày', dusk: 'Hoàng hôn', night: 'Ban đêm' }[mood]} · Trục ${gridRef(mx)} · cách trục A ${my.toFixed(1)} m · cao ${(player.feet.y).toFixed(2)} m · ${fpsShow} fps · độ phân giải ${Math.round(pr * 100)}%<br>WASD đi · Shift nhanh · Space nhảy · F ghost · 1/2/3 thời gian · R mái · L nhãn · O cửa cuốn`;
    composer.render();
    requestAnimationFrame(tick);
  }
  tick();
  window._walk = { player, keys, boxes, groundAt, camera, V, update, hud: () => hud.textContent, mergeReport, renderer, composer, applyMood };
  window.ready = true;
}
</script></body></html>
